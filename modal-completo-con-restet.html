<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ejemplo 5 - Modal completo (selector/login/registro) + reset</title>

  <!-- Bootstrap 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Mi App</a>
      <div class="ms-auto">
        <button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#modalLogin">
          <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h4">Ejemplo 5: Todo en un solo HTML</h1>
    <p class="text-muted">
      Incluye selector, login y registro dentro del mismo modal.
      Al cerrar el modal se resetean campos y vista.
    </p>
  </main>

  <!-- Modal -->
  <div class="modal fade" id="modalLogin" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">
            <i class="bi bi-person-circle me-2"></i>Login
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
          <!-- Pantalla: elegir -->
          <div id="view-choose">
            <p class="mb-3">Elige una opción:</p>
            <div class="d-grid gap-2">
              <button id="go-login" type="button" class="btn btn-outline-primary">
                <i class="bi bi-box-arrow-in-right me-2"></i>Identificarse
              </button>
              <button id="go-register" type="button" class="btn btn-outline-success">
                <i class="bi bi-person-plus me-2"></i>Registrarse
              </button>
            </div>
          </div>

          <!-- Pantalla: login -->
          <form id="view-login" class="d-none">
            <h6 class="mb-3">Identificarse</h6>
            <div class="mb-3">
              <label class="form-label">Correo</label>
              <input id="loginEmail" type="email" class="form-control" placeholder="usuario@correo.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input id="loginPass" type="password" class="form-control" placeholder="••••••••" required>
            </div>
          </form>

          <!-- Pantalla: register -->
          <form id="view-register" class="d-none">
            <h6 class="mb-3">Registrarse</h6>

            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input id="regEmail" type="email" class="form-control" placeholder="usuario@correo.com" required>
            </div>

            <div class="row g-2">
              <div class="col-md-6 mb-3">
                <label class="form-label">Contraseña</label>
                <input id="regPass1" type="password" class="form-control" placeholder="••••••••" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Repetir contraseña</label>
                <input id="regPass2" type="password" class="form-control" placeholder="••••••••" required>
                <div id="regPassHelp" class="form-text"></div>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label">Nombre de usuario</label>
              <input id="regUser" type="text" class="form-control" placeholder="miUsuario" required>
            </div>
          </form>
        </div>

        <div class="modal-footer" id="modalFooter">
          <!-- Se rellena dinámicamente -->
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const modalEl = document.getElementById('modalLogin');
    const modalTitle = document.getElementById('modalTitle');
    const footer = document.getElementById('modalFooter');

    const viewChoose = document.getElementById('view-choose');
    const viewLogin = document.getElementById('view-login');
    const viewRegister = document.getElementById('view-register');

    const goLogin = document.getElementById('go-login');
    const goRegister = document.getElementById('go-register');

    const loginEmail = document.getElementById('loginEmail');
    const loginPass = document.getElementById('loginPass');

    const regEmail = document.getElementById('regEmail');
    const regPass1 = document.getElementById('regPass1');
    const regPass2 = document.getElementById('regPass2');
    const regPassHelp = document.getElementById('regPassHelp');
    const regUser = document.getElementById('regUser');

    let step = 'choose'; // choose | login | register

    function setStep(next) {
      step = next;

      viewChoose.classList.toggle('d-none', step !== 'choose');
      viewLogin.classList.toggle('d-none', step !== 'login');
      viewRegister.classList.toggle('d-none', step !== 'register');

      if (step === 'choose') {
        modalTitle.innerHTML = '<i class="bi bi-person-circle me-2"></i>Login';
        footer.innerHTML = `
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        `;
      }

      if (step === 'login') {
        modalTitle.textContent = 'Identificarse';
        footer.innerHTML = `
          <button type="button" class="btn btn-outline-secondary" id="backToChoose">Atrás</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btnLogin">
            <i class="bi bi-box-arrow-in-right me-2"></i>Loguear
          </button>
        `;
        document.getElementById('backToChoose').addEventListener('click', () => setStep('choose'));
        document.getElementById('btnLogin').addEventListener('click', () => {
          if (!loginEmail.value || !loginPass.value) return;
          alert('Ejemplo: login con ' + loginEmail.value);
        });
      }

      if (step === 'register') {
        modalTitle.textContent = 'Registrarse';
        footer.innerHTML = `
          <button type="button" class="btn btn-outline-secondary" id="backToChoose2">Atrás</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-success" id="btnRegister">
            <i class="bi bi-person-plus me-2"></i>Registrarse
          </button>
        `;
        document.getElementById('backToChoose2').addEventListener('click', () => setStep('choose'));
        document.getElementById('btnRegister').addEventListener('click', () => {
          const ok = regPass1.value && regPass1.value === regPass2.value;
          if (!regEmail.value || !regUser.value || !ok) return;
          alert('Ejemplo: registro de ' + regUser.value + ' (' + regEmail.value + ')');
        });
      }
    }

    function resetAll() {
      // reset vista
      setStep('choose');

      // reset campos
      [loginEmail, loginPass, regEmail, regPass1, regPass2, regUser].forEach(i => i.value = '');
      regPass2.classList.remove('is-valid', 'is-invalid');
      regPassHelp.textContent = '';
    }

    function validatePasswords() {
      if (!regPass2.value) {
        regPass2.classList.remove('is-valid', 'is-invalid');
        regPassHelp.textContent = '';
        return;
      }
      const ok = regPass1.value && regPass1.value === regPass2.value;
      regPass2.classList.toggle('is-valid', ok);
      regPass2.classList.toggle('is-invalid', !ok);
      regPassHelp.textContent = ok ? 'Las contraseñas coinciden.' : 'Las contraseñas no coinciden.';
    }

    goLogin.addEventListener('click', () => setStep('login'));
    goRegister.addEventListener('click', () => setStep('register'));

    regPass1.addEventListener('input', validatePasswords);
    regPass2.addEventListener('input', validatePasswords);

    // Cuando el modal se cierra (X, cancelar, click fuera, ESC) => reset total
    modalEl.addEventListener('hidden.bs.modal', resetAll);

    // estado inicial
    setStep('choose');
  </script>
</body>
</html>
